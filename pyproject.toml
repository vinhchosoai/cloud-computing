[project]
name = "ai-inference-service"
version = "1.0.0"
description = "Cloud AI Text Classification Inference Service with Autoscaling, Monitoring, and Cost Analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "numpy>=1.26.0,<2.3.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
ml = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "optimum[onnxruntime]>=1.23.0",
    "onnx>=1.17.0",
    "scikit-learn>=1.5.0",
    "skl2onnx>=1.17.0",
    "mlflow>=2.17.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "scipy>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

